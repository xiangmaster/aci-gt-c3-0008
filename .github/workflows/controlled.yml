name: C3 negative actor gate
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  mutate:
    steps:
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ github.event.comment.body }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: 'Write,Bash(git:*)'
      - run: |
          echo "${{ steps.agent.outputs.result }}" > result.txt
          git add result.txt
          git commit -m result
          git push
